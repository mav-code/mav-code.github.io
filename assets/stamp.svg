<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="ink" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.11" numOctaves="3" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"
        xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="rule" width="100" height="3.2" patternUnits="userSpaceOnUse">
      <rect width="100" height="2.1" fill="#b45f06"/>
    </pattern>
  </defs>

  <g filter="url(#ink)">
    <rect x="0.7" y="0.7" width="98.6" height="98.6" fill="none" stroke="#b45f06" stroke-width="1.4"/>
    <rect x="4.4" y="4.4" width="91.2" height="91.2" fill="url(#rule)"/>
    <g transform="translate(4.4 4.4) scale(0.9120)">
    <g font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#ffffff" text-anchor="middle">
      <text x="50" y="44.35" font-size="70.238">m</text>
      <text x="29.3" y="87.35" font-size="70.238">t</text>
      <text x="62.1" y="75.763" font-size="71.429">p</text>
    </g>
    </g>
  </g>
</svg>
